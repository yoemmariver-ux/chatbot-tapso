<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente Virtual Tapso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Banner principal -->
  <header class="banner">
    <img src="banner.jpg" alt="Tapso" class="banner-img">
    <div class="banner-text">Bienvenido a Tapso</div>
  </header>

  <!-- Logo del municipio -->
  <img id="logo-municipio" src="logo.png" alt="Logo Tapso">

  <!-- Chat interactivo -->
  <div id="chat"></div>
  <input id="entrada" type="text" placeholder="Escribe tu mensaje...">
  <button id="btnEnviar">Enviar</button>
  <button id="btnLimpiar">Limpiar</button>
  <button id="toggleModo">Modo Oscuro</button>

  <!-- Galería interactiva -->
  <h2>Explora Tapso</h2>
  <p>Haz clic en las imágenes para conocer más:</p>
  <div class="galeria">
    <img src="tapsofc.jpg" alt="Tapso FC" onclick="mostrarInfo('tapsofc')">
    <img src="festival.jpg" alt="Festival Unión de Pueblos" onclick="mostrarInfo('festival')">
    <img src="hosteria.jpg" alt="Hostería Tapso" onclick="mostrarInfo('hosteria')">
  </div>

  <!-- Contenedor de información extra -->
  <div id="infoExtra" class="info"></div>

  <script src="script.js"></script>
  <script>
    function mostrarInfo(tipo) {
      const infoExtra = document.getElementById("infoExtra");
      if (tipo === "tapsofc") {
        infoExtra.textContent = "⚽ Tapso FC participa en el Torneo Regional Federal Amateur. Actualmente ocupa la posición 4 de su grupo, con un 17% de victorias. Ha marcado 6 goles y recibido 16 en la temporada.";
      } else if (tipo === "festival") {
        infoExtra.textContent = "🎶 El Festival Unión de Pueblos se realiza cada junio en Tapso, con música folclórica, danza y gastronomía típica. También se celebra la Fiesta Patronal en honor a San Roque en agosto.";
      } else if (tipo === "hosteria") {
        infoExtra.textContent = "🏨 La Hostería Tapso está en Av. Virgen del Valle 4234. Check-in desde las 14:00, check-out hasta las 10:00. No admite mascotas. Ofrece habitaciones cómodas y entorno rural tranquilo.";
      }
    }
  </script>
</body>
</html>
