<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Municipal - Tapso</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- MODAL INICIAL DE NOMBRE -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>🏛️ ¡Bienvenido a Tapso!</h2>
      <p>Por favor, decinos tu nombre para personalizar la atención:</p>
      <input type="text" id="nombre" placeholder="Tu nombre aquí..." autofocus>
      <button id="btnComenzar" class="btn-primary">Ingresar al Portal</button>
    </div>
  </div>

  <!-- BARRA SUPERIOR DE ACCESIBILIDAD -->
  <div class="accessibility-bar">
    <div class="accessibility-container">
      <span class="acc-label">Accesibilidad:</span>
      <button onclick="cambiarTamanioTexto(-1)" class="btn-acc" title="Reducir texto">A-</button>
      <button onclick="cambiarTamanioTexto(1)" class="btn-acc" title="Aumentar texto">A+</button>
      <button onclick="restablecerTamanioTexto()" class="btn-acc" title="Restablecer tamaño">A</button>
      <button onclick="toggleAltoContraste()" class="btn-acc btn-contrast" title="Alto Contraste">👁️ Contraste</button>
    </div>
  </div>

  <!-- ENCABEZADO -->
  <header>
    <div class="header-container">
      <div class="logo-area">
        <span class="escudo">🏛️</span>
        <div>
          <h1>Municipio de Tapso</h1>
          <p class="subtitle">Catamarca - Santiago del Estero</p>
        </div>
      </div>
      <button onclick="toggleDarkMode()" class="theme-toggle" title="Cambiar modo claro/oscuro">🌙 / ☀️</button>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DEL CHAT -->
  <main class="chat-container">
    
    <!-- BARRA DE CONTROLES DE AUDIO Y VOZ -->
    <div class="audio-controls">
      <label for="selectVoz"><i class="fas fa-volume-up"></i> Lectura de voz:</label>
      <select id="selectVoz" class="select-voz">
        <option value="">Cargando voces...</option>
      </select>
      <button id="btnToggleAudio" onclick="toggleAudio()" class="btn-audio-toggle" title="Activar/Desactivar audio">
        🔊 Activado
      </button>
    </div>

    <div id="chatBox" class="chat-box">
      <!-- Mensajes dinámicos vía JS -->
    </div>

    <div class="input-area">
      <input type="text" id="mensaje" placeholder="Escribe tu mensaje..." autocomplete="off">
      <button id="btnEnviar" class="btn-send"><i class="fas fa-paper-plane"></i> Enviar</button>
    </div>

    <div class="actions-area">
      <button onclick="limpiar()" class="btn-clear"><i class="fas fa-broom"></i> Limpiar chat</button>
    </div>
  </main>

  <!-- SECCIÓN GALERÍAS -->
  <section class="gallery-section">
    <h3>🖼️ Galería de Fotos e Instalaciones</h3>
    <div class="gallery-buttons">
      <button onclick="abrirGaleria('hosteria')" class="btn-gallery">🏨 Hostería Municipal</button>
      <button onclick="abrirGaleria('tapsofc')" class="btn-gallery">⚽ Club Tapso FC</button>
      <button onclick="abrirGaleria('festival')" class="btn-gallery">🎉 Festival Unión de Pueblos</button>
      <button onclick="abrirGaleria('padel')" class="btn-gallery">🎾 Liga de Pádel</button>
    </div>
  </section>

  <!-- MODAL LIGHTBOX DE GALERÍA -->
  <div id="galleryModal" class="modal-gallery">
    <span class="close-gallery" onclick="cerrarGaleria()">&times;</span>
    <div class="modal-gallery-content">
      <button class="prev" onclick="cambiarImagen(-1)">&#10094;</button>
      <div class="image-wrapper">
        <img id="imgGaleria" src="" alt="Imagen de galería">
        <p id="captionGaleria" class="caption"></p>
      </div>
      <button class="next" onclick="cambiarImagen(1)">&#10095;</button>
    </div>
  </div>

  <!-- CONTACTO Y WHATSAPP -->
  <footer>
    <div class="footer-content">
      <p>¿Necesitás atención directa?</p>
      <a href="https://wa.me/5493856096508" target="_blank" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i> Contactar por WhatsApp
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
