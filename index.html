<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente Tapso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal de bienvenida -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Bienvenido</h2>
      <p>Por favor, ingresa tu nombre para comenzar:</p>
      <input type="text" id="nombre" placeholder="Tu nombre" autofocus>
      <button id="btnComenzar" onclick="login()">Comenzar</button>
    </div>
  </div>

  <!-- Contenedor principal del chat -->
  <div id="chatContainer">
    <!-- Logo del municipio -->
    <img src="images/logo.png" alt="Logo Tapso" class="logo-municipio">

    <h1 class="logo">🌟 Tapso Asistente Municipal 🌟</h1>

    <!-- Caja de chat -->
    <div id="chatBox" class="chat-box"></div>

    <!-- Área de entrada de mensajes -->
    <div class="input-area">
      <input type="text" id="mensaje" placeholder="Escribe tu mensaje...">
      <button id="btnEnviar">Enviar</button>
    </div>

    <!-- Botones extra -->
    <div class="extras">
      <button onclick="limpiar()">🧹 Limpiar chat</button>
      <button onclick="toggleDarkMode()">🌙 Modo oscuro</button>
    </div>

    <!-- Ícono de WhatsApp -->
    <div class="whatsapp">
      <a href="https://wa.me/549XXXXXXXXXX" target="_blank">
        <img src="images/whatsapp.png" alt="WhatsApp" width="50">
      </a>
      <p>Atención personalizada</p>
    </div>
  </div>

  <!-- Conexión al script -->
  <script src="script.js"></script>
</body>
</html>
