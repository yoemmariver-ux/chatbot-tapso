<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Oficial - Municipalidad de Tapso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MODAL DE INICIO (NOMBRE Y AUDIO DE BIENVENIDA) -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-content">
      <h2>Municipalidad de Tapso</h2>
      <p>Por favor, ingresa tu nombre para comenzar:</p>
      <input type="text" id="nombre" placeholder="Tu nombre..." autocomplete="off">
      <button id="btnComenzar">Comenzar</button>
    </div>
  </div>

  <!-- ENCABEZADO CON CLIMA A LA IZQUIERDA Y LOGO/TÍTULO A LA DERECHA -->
  <header class="header-municipal">
    <div class="clima-header-container">
      <a class="weatherwidget-io" href="https://forecast7.com/es/n28d40n65d10/tapso/" data-label_1="TAPSO" data-label_2="WEATHER" data-theme="original">TAPSO WEATHER</a>
      <script>
      !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
      </script>
    </div>

    <div class="logo-titulo-container">
      <h1>Portal Oficial - Municipalidad de Tapso</h1>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DEL CHAT -->
  <main class="main-container">
    <div class="chat-wrapper">
      <div id="chatBox" class="chat-box"></div>
      
      <div class="input-area">
        <input type="text" id="mensaje" placeholder="Escribí tu consulta aquí..." autocomplete="off">
        <button id="btnEnviar">Enviar</button>
      </div>
    </div>

    <!-- BOTONES DE ACCIÓN RÁPIDA -->
    <div class="controles-extra">
      <button onclick="limpiar()">Reiniciar Chat</button>
      <button onclick="toggleDarkMode()">Modo Oscuro</button>
    </div>
  </main>

  <!-- MODAL DE GALERÍA DE IMÁGENES -->
  <div id="galleryModal" class="modal-overlay" style="display: none;">
    <div class="gallery-content">
      <span class="close-btn" onclick="cerrarGaleria()">&times;</span>
      <img id="imgGaleria" src="" alt="Imagen de Galería">
      <p id="captionGaleria"></p>
      <div class="gallery-nav">
        <button onclick="cambiarImagen(-1)">&#10094; Anterior</button>
        <button onclick="cambiarImagen(1)">Siguiente &#10095;</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
