<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tapso 200 años</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Banner -->
  <header>
    <img src="banner.png" alt="Banner Tapso" class="banner">
    <h1>200 años Tapso (1820–2020)</h1>
  </header>

  <!-- Explora Tapso -->
  <section id="explora">
    <h2>Explora Tapso</h2>
    <div class="item">
      <img src="tapsofc.png" alt="Tapso FC 2020">
      <div class="info">Equipo de fútbol local, fundado en 2020.</div>
    </div>
    <div class="item">
      <img src="festival.png" alt="Festival Unión de Pueblos">
      <div class="info">Festival cultural que une comunidades.</div>
    </div>
    <div class="item">
      <img src="edificio.png" alt="Edificio Tapso">
      <div class="info">Edificio histórico de Tapso.</div>
    </div>
  </section>

  <!-- Chat -->
  <section id="chat">
    <h2>Chat Tapso</h2>
    <div id="chatBox"></div>
    <input type="text" id="mensaje" placeholder="Escribe tu mensaje...">
    <button onclick="enviar()">Enviar</button>
    <button onclick="limpiar()">Limpiar</button>
    <button onclick="toggleDarkMode()">Modo Oscuro</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
