<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tapso 200 años</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Banner -->
  <header>
    <h1>200 años Tapso (1820–2020)</h1>
  </header>

  <!-- Login -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Bienvenido</h2>
      <input type="text" id="nombre" placeholder="Ingresa tu nombre">
      <button onclick="login()">Entrar</button>
      <button id="gmailLogin">Login con Gmail</button>
    </div>
  </div>

  <!-- Conectá con Tapso -->
  <section id="conecta">
    <h2>Conectá con Tapso</h2>
    <div class="icons">
      <a href="#">Instagram</a>
      <a href="#">WhatsApp</a>
      <a href="#">Ubicación</a>
    </div>
  </section>

  <!-- Explora Tapso -->
  <section id="explora">
    <h2>Explora Tapso</h2>
    <div class="gallery">
      <img src="tapsofc.png" alt="Tapso FC 2020">
      <img src="festival.png" alt="Festival Unión de Pueblos">
      <img src="edificio.png" alt="Edificio Tapso">
    </div>
  </section>

  <!-- Calendario -->
  <section id="calendario">
    <h2>Calendario de Eventos</h2>
    <ul>
      <li>12 de agosto: Fiesta Patronal</li>
      <li>Junio: Festival Unión de Pueblos</li>
      <li>Enero: Fiesta de la Quebrada</li>
      <li>Tapso FC vs San Lorenzo (fecha a confirmar)</li>
    </ul>
  </section>

  <!-- Chat -->
  <section id="chat">
    <h2>Chat Tapso</h2>
    <div id="chatBox"></div>
    <input type="text" id="mensaje" placeholder="Escribe tu mensaje...">
    <button onclick="enviar()">Enviar</button>
    <button onclick="limpiar()">Limpiar</button>
    <button onclick="toggleDarkMode()">Modo Oscuro</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
