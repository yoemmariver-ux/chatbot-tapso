<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Asistente Tapso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Modal de bienvenida -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Bienvenido</h2>
      <p>Por favor, ingresa tu nombre para comenzar:</p>
      <input type="text" id="nombre" placeholder="Tu nombre" autofocus>
      <button id="btnComenzar">Comenzar</button>
    </div>
  </div>

  <!-- Contenedor principal -->
  <div id="main">
    <!-- Conocé Tapso a la izquierda -->
    <div id="conoce">
      <h2 class="section-title">Conocé Tapso</h2>
      <div class="item">
        <img src="images/tapsofc.jpg" alt="Tapso FC" class="conoce-img">
        <p class="info">Club Tapso FC</p>
      </div>
      <div class="item">
        <img src="images/hosteria.jpg" alt="Hostería" class="conoce-img">
        <p class="info">La histórica hostería de Tapso</p>
      </div>
      <div class="item">
        <img src="images/festival.jpg" alt="Festival" class="conoce-img">
        <p class="info">Festival Unión de Pueblos</p>
      </div>
    </div>

    <!-- Sección central -->
    <div id="central">
      <!-- Banner -->
      <img src="images/banner-tapso.png" alt="Banner Tapso" class="banner-img">
      <!-- Logo municipio -->
      <img src="images/logo-tapso.png" alt="Logo Tapso" class="logo-municipio">
      <!-- Redes sociales -->
      <div class="icons">
        <img src="images/facebook.png" alt="Facebook">
        <img src="images/instagram.png" alt="Instagram">
        <img src="images/watsapp.png" alt="WhatsApp">
        <img src="images/ubicacion.png" alt="Ubicación">
      </div>
      <!-- Ventana de chat -->
      <div id="chat">
        <h2 class="section-title">Asistente Municipal</h2>
        <div id="chatBox" class="chat-window"></div>
        <input type="text" id="mensaje" placeholder="Escribe tu mensaje...">
        <button id="btnEnviar">Enviar</button>
        <button onclick="limpiar()">🧹 Limpiar chat</button>
        <button onclick="toggleDarkMode()">🌙 Modo oscuro</button>
      </div>
    </div>

    <!-- Calendario a la derecha -->
    <div id="calendario">
      <h2 class="section-title">Calendario</h2>
      <p>Próximos eventos municipales</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
